<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<title>Abfahrt</title>
<script>
  // Die Beta-Version läuft unter …/beta/ – mit eigenem Namen, Icon, Manifest und eigenen Daten,
  // damit sich beide Versionen nebeneinander installieren lassen.
  // „…/abfahrt/beta“ ohne Schrägstrich auf „…/abfahrt/beta/“ umleiten, sonst passen die relativen Pfade nicht
  if (/\/beta$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  const BETA = /\/beta(\/|$)/.test(location.pathname);
  const APP_NAME = BETA ? "Abfahrt Beta" : "Abfahrt";
  const SFX = BETA ? "-beta" : "";
  document.title = APP_NAME;
  if (BETA) document.documentElement.classList.add("beta");
  document.write(
    `<link rel="manifest" href="manifest${SFX}.json">` +
    `<link rel="icon" href="icon${SFX}.svg" type="image/svg+xml">` +
    `<link rel="apple-touch-icon" href="apple-touch-icon${SFX}.png">` +
    `<meta name="apple-mobile-web-app-title" content="${APP_NAME}">`
  );
</script>
<!-- iPhone: als Vollbild-App vom Home-Bildschirm starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --board: #0a1a33;
    --board-row: #0f2343;
    --line: #1d3560;
    --text: #ffffff;
    --muted: #9fb3d1;
    --yellow: #ffd200;
    --red: #ff4d4d;
    --green: #4cd964;
    --accent: #e2002a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--board);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- Kopfzeile ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--board);
    border-bottom: 2px solid var(--accent);
  }
  header h1 {
    flex: 1; margin: 0; font-size: 20px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #clock { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }

  /* Beta-Kennzeichnung */
  .betatag { display: none; padding: 3px 7px; border-radius: 6px; background: #ff9500; color: #000; font-size: 12px; font-weight: 800; letter-spacing: .05em; }
  .beta .betatag { display: inline-block; }
  .beta header { border-bottom-color: #ff9500; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center; background: var(--board-row);
  }
  .iconbtn svg { width: 22px; height: 22px; }

  /* ---------- Auswahl ---------- */
  #picker { padding: 12px 16px 40px; }
  #search {
    width: 100%; padding: 14px 16px; font-size: 17px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--board-row); color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--yellow); }
  #search::placeholder { color: var(--muted); }
  .group-title {
    margin: 22px 0 6px; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li button {
    width: 100%; text-align: left; padding: 14px 4px;
    font-size: 17px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .list li button:active { background: var(--board-row); }
  .list .star { color: var(--yellow); }
  .hint { color: var(--muted); font-size: 14px; padding: 10px 4px; }

  /* ---------- Abfahrtstafel ---------- */
  #board-wrap { padding-bottom: 30px; }
  .toolbar {
    display: flex; gap: 8px; padding: 10px 16px; align-items: center; flex-wrap: wrap;
  }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .chip.on { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 600; }
  .toolbar .spacer { flex: 1; }
  .chip.maplink { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text); }
  .chip.maplink svg { width: 16px; height: 16px; }
  #updated { color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  tbody tr:nth-child(odd) { background: var(--board-row); }
  td { padding: 11px 8px; vertical-align: top; font-size: 17px; }
  td.time { width: 64px; font-weight: 700; font-variant-numeric: tabular-nums; padding-left: 16px; }
  td.time .rt { display: block; font-size: 14px; font-weight: 600; }
  td.time .t { display: inline-flex; align-items: center; gap: 6px; }

  /* Statuspunkt wie auf der Bahnhofsanzeige: grün = pünktlich, gelb = verspätet, rot = fällt aus */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.late { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot.cancel { background: var(--red); }
  .dot.none { background: transparent; border: 1px solid var(--line); }
  .dot.blink { animation: blink 1.8s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .dot.blink { animation: none; } }
  #updated .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: middle; }
  #updated.stale .live { background: var(--red); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 16px 8px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .ontime { color: var(--green); }
  .late { color: var(--yellow); }
  .cancel { color: var(--red); }
  td.train { width: 84px; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 5px;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    background: #fff; color: var(--board);
  }
  .badge.fv { background: var(--accent); color: #fff; }   /* Fernverkehr */
  .badge.s  { background: #0074c8; color: #fff; }          /* S-Bahn */
  .badge.r  { background: #ffffff; color: var(--board); }  /* Regional */
  .badge.u  { background: #6b7a90; color: #fff; }          /* Stadtverkehr/Bus */
  td.dest { font-weight: 600; }
  td.dest .via { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  td.dest .note { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }
  tr.cancelled td.dest .name { text-decoration: line-through; color: var(--muted); }
  td.track { width: 54px; text-align: right; font-weight: 700; padding-right: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.track.changed { color: var(--yellow); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  /* Hinweis auf neue Version */
  #update {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px 12px 16px; border-radius: 14px;
    background: #ffffff; color: var(--board); box-shadow: 0 6px 24px rgba(0,0,0,.45);
    max-width: 520px; margin: 0 auto;
  }
  #update .txt { flex: 1; font-size: 15px; line-height: 1.3; }
  #update .txt b { display: block; }
  #update .txt small { color: #4a5b75; }
  #update button { background: var(--accent); color: #fff; font-weight: 700; padding: 10px 14px; border-radius: 10px; white-space: nowrap; }
  #update button:disabled { opacity: .6; }
  footer .version { display: block; margin-top: 6px; opacity: .7; }
  .err { color: var(--red); }
  footer { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--muted); }

  @media (max-width: 420px) {
    td { font-size: 15px; padding: 10px 6px; }
    td.time { width: 54px; padding-left: 12px; }
    td.train { width: 70px; }
    td.track { padding-right: 12px; width: 44px; }
    .badge { font-size: 12px; padding: 2px 5px; }
  }
</style>
</head>
<body>

<header>
  <button id="back" class="iconbtn hidden" aria-label="Station wählen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="title">Station wählen</h1>
  <button id="fav" class="iconbtn hidden" aria-label="Als Favorit merken">
    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path id="favpath" fill="none" d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
  </button>
  <span class="betatag">BETA</span>
  <span id="clock"></span>
</header>

<!-- Bahnhofsauswahl -->
<main id="picker">
  <input id="search" type="search" placeholder="Bahnhof oder Haltestelle suchen …" autocomplete="off">
  <div id="results"></div>
  <div id="lists"></div>
  <footer><span class="version"></span></footer>
</main>

<!-- Abfahrtstafel -->
<main id="board-wrap" class="hidden">
  <div class="toolbar">
    <button class="chip on" data-filter="train">Nur Züge</button>
    <button class="chip" data-filter="all">Alle Verkehrsmittel</button>
    <a class="chip maplink" id="maplink" href="https://fahrplan.oebb.at/webapp/?showLivemap=true" target="_blank" rel="noopener" title="Fahrzeuge live auf der ÖBB-Karte rund um diese Station">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      Livekarte
    </a>
    <span class="spacer"></span>
    <span id="updated"></span>
  </div>
  <div class="legend">
    <span><i class="dot ok"></i>pünktlich</span>
    <span><i class="dot late"></i>verspätet</span>
    <span><i class="dot cancel"></i>fällt aus</span>
    <span><i class="dot ok blink"></i>fährt gleich ab</span>
  </div>
  <table>
    <thead><tr><th style="padding-left:16px">Zeit</th><th>Zug</th><th>Nach</th><th style="text-align:right;padding-right:16px">Steig</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="msg" class="empty hidden"></div>
  <footer>Echtzeitdaten: ÖBB Scotty · <a id="scotty" href="#" target="_blank" rel="noopener">In ÖBB Scotty öffnen</a><span class="version"></span></footer>
</main>

<!-- Hinweis auf neue Version -->
<div id="update" class="hidden" role="status">
  <span class="txt"><b>Neue Version verfügbar</b><small>Favoriten bleiben erhalten</small></span>
  <button id="update-btn">Aktualisieren</button>
</div>

<script src="stations.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const FILTERS = { train: "1111110000000000", all: "1111111111111111" };
const BASE = "https://fahrplan.oebb.at/bin/";
const REFRESH_MS = 30000;

// ---------- kleine Helfer ----------
// Beta speichert unter eigenem Präfix, damit Favoriten der beiden Versionen getrennt bleiben
const KEY = BETA ? "beta:" : "";
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} },
  remove(k) { try { localStorage.removeItem(KEY + k); } catch {} },
};
const decoder = document.createElement("textarea");
function unescapeHtml(s) { decoder.innerHTML = s || ""; return decoder.value; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// HAFAS liefert JavaScript statt JSON und erlaubt kein CORS – daher per <script> laden.
let chain = Promise.resolve();
function loadScript(url, globalName) {
  const job = () => new Promise((resolve, reject) => {
    delete window[globalName];
    const s = document.createElement("script");
    s.charset = "ISO-8859-1";
    s.src = url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
    const done = () => s.remove();
    const timer = setTimeout(() => { done(); reject(new Error("Zeitüberschreitung")); }, 15000);
    s.onload = () => { clearTimeout(timer); done(); resolve(window[globalName]); };
    s.onerror = () => { clearTimeout(timer); done(); reject(new Error("Keine Verbindung zu ÖBB")); };
    document.head.appendChild(s);
  });
  const p = chain.then(job, job);
  chain = p.catch(() => {});
  return p;
}

// ---------- Uhr ----------
function tick() {
  $("#clock").textContent = new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
}
tick(); setInterval(tick, 1000);

// ---------- Auswahl ----------
function favorites() { return store.get("favs", []); }
function recent() { return store.get("recent", []); }

function stationButton(st, starred) {
  return `<li><button data-id="${esc(st.id)}" data-name="${esc(st.n)}" data-bahn="${st.bahn === false ? 0 : 1}" data-x="${st.x || ""}" data-y="${st.y || ""}">
    <span>${esc(st.n)}</span>${starred ? '<span class="star">★</span>' : ""}</button></li>`;
}

function renderLists() {
  const favs = favorites();
  const favIds = new Set(favs.map(f => f.id));
  let html = "";
  if (favs.length) html += `<div class="group-title">Favoriten</div><ul class="list">${favs.map(f => stationButton(f, true)).join("")}</ul>`;
  const rec = recent().filter(r => !favIds.has(r.id)).slice(0, 4);
  if (rec.length) html += `<div class="group-title">Zuletzt</div><ul class="list">${rec.map(r => stationButton(r)).join("")}</ul>`;
  for (const g of ["Wien", "Niederösterreich"]) {
    html += `<div class="group-title">${g}</div><ul class="list">${
      STATIONS.filter(s => s.g === g).map(s => stationButton(s, favIds.has(s.id))).join("")}</ul>`;
  }
  $("#lists").innerHTML = html;
}

// Suche: erst lokale Liste, dann ÖBB-Stationssuche (auf Wien/NÖ eingegrenzt)
let searchTimer;
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
$("#search").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (!q) { $("#results").innerHTML = ""; $("#lists").classList.remove("hidden"); return; }
  $("#lists").classList.add("hidden");
  const local = STATIONS.filter(s => norm(s.n).includes(norm(q)));
  showResults(local, q.length >= 3 ? "Suche bei ÖBB …" : "");
  if (q.length < 3) return;
  searchTimer = setTimeout(async () => {
    try {
      window.SLs = { showSuggestion() {} };
      const url = BASE + "ajax-getstop.exe/dn?REQ0JourneyStopsS0A=1&REQ0JourneyStopsB=25&js=true&S=" + encodeURIComponent(q);
      await loadScript(url, "__none__");
      if ($("#search").value.trim() !== q) return;
      const found = (window.SLs.sls?.suggestions || [])
        .filter(x => x.type === "1")
        .filter(x => { const X = x.xcoord / 1e6, Y = x.ycoord / 1e6; return X > 14.4 && X < 17.2 && Y > 47.4 && Y < 49.1; })
        // prodClass: Bitmaske der Verkehrsmittel; die unteren 6 Bits sind Bahn → sonst reine Bus/Bim/U-Bahn-Haltestelle
        .map(x => ({ n: unescapeHtml(x.value), id: String(+x.extId), bahn: (x.prodClass & 63) > 0, x: +x.xcoord, y: +x.ycoord }));
      const seen = new Set(local.map(s => s.id));
      showResults(local.concat(found.filter(f => !seen.has(f.id) && seen.add(f.id))), "");
    } catch (err) {
      showResults(local, "Online-Suche nicht möglich: " + err.message);
    }
  }, 300);
});

function showResults(list, hint) {
  $("#results").innerHTML =
    (list.length ? `<ul class="list">${list.map(s => stationButton(s)).join("")}</ul>` : "") +
    (hint ? `<div class="hint">${esc(hint)}</div>` : (list.length ? "" : `<div class="hint">Keine Station in Wien/NÖ gefunden.</div>`));
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (b) openStation({ id: b.dataset.id, n: b.dataset.name, bahn: b.dataset.bahn !== "0", x: +b.dataset.x || undefined, y: +b.dataset.y || undefined });
});

// ---------- Tafel ----------
let current = null, refreshTimer = null;
let filter = "train";

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".chip[data-filter]").forEach(x => x.classList.toggle("on", x.dataset.filter === f));
}

function openStation(st, push = true) {
  current = st;
  // Bahnhof → standardmäßig nur Züge; Haltestelle ohne Bahn → alle Verkehrsmittel
  setFilter(st.bahn === false ? "all" : "train");
  const rec = [st].concat(recent().filter(r => r.id !== st.id)).slice(0, 6);
  store.set("recent", rec);
  if (push) history.pushState({ st }, "", "?id=" + encodeURIComponent(st.id) + "&n=" + encodeURIComponent(st.n) + (st.bahn === false ? "&hst=1" : ""));
  $("#picker").classList.add("hidden");
  $("#board-wrap").classList.remove("hidden");
  $("#back").classList.remove("hidden");
  $("#fav").classList.remove("hidden");
  $("#title").textContent = st.n;
  document.title = st.n + " – " + APP_NAME;
  $("#scotty").href = BASE + "stboard.exe/dn?input=" + encodeURIComponent(st.id) + "&boardType=dep&start=yes";
  // Livekarte: ÖBB-Seite öffnet direkt die Karte, zentriert auf die Station (Zoom legt die ÖBB-Seite fest)
  if (!st.x) Object.assign(st, (({ x, y }) => ({ x, y }))(STATIONS.find(s => s.id === st.id) || {}));
  $("#maplink").href = "https://fahrplan.oebb.at/webapp/?showLivemap=true" + (st.x && st.y ? "&X=" + st.x + "&Y=" + st.y : "");
  updateFavIcon();
  lastUpdate = 0; failures = 0; showUpdated();
  $("#rows").innerHTML = "";
  showMsg("Lade Abfahrten …");
  window.scrollTo(0, 0);
  load();
}

function showPicker() {
  current = null;
  clearTimeout(refreshTimer);
  $("#board-wrap").classList.add("hidden");
  $("#picker").classList.remove("hidden");
  $("#back").classList.add("hidden");
  $("#fav").classList.add("hidden");
  $("#title").textContent = "Station wählen";
  document.title = APP_NAME;
  $("#search").value = "";
  $("#results").innerHTML = "";
  $("#lists").classList.remove("hidden");
  renderLists();
}

$("#back").addEventListener("click", () => {
  if (history.state && history.state.st) history.back();
  else { history.replaceState(null, "", location.pathname); showPicker(); }
});
window.addEventListener("popstate", (e) => {
  if (e.state && e.state.st) openStation(e.state.st, false); else showPicker();
});

function updateFavIcon() {
  const on = favorites().some(f => f.id === current?.id);
  $("#favpath").setAttribute("fill", on ? "#ffd200" : "none");
  $("#fav").style.color = on ? "#ffd200" : "";
}
$("#fav").addEventListener("click", () => {
  let favs = favorites();
  if (favs.some(f => f.id === current.id)) favs = favs.filter(f => f.id !== current.id);
  else favs.push({ id: current.id, n: current.n, bahn: current.bahn, x: current.x, y: current.y });
  store.set("favs", favs);
  updateFavIcon();
});

// Umschalten gilt nur für die aktuelle Ansicht; beim nächsten Öffnen greift wieder der Standard
document.querySelectorAll(".chip[data-filter]").forEach(c => {
  c.addEventListener("click", () => {
    setFilter(c.dataset.filter);
    $("#rows").innerHTML = ""; showMsg("Lade Abfahrten …"); load();
  });
});

function showMsg(t, isErr) {
  const m = $("#msg"); m.textContent = t; m.classList.toggle("err", !!isErr); m.classList.toggle("hidden", !t);
}

function badgeClass(pr) {
  if (/^(RJX?|EC|IC|ICE|NJ|EN|D|WB)\s?\d/.test(pr)) return "fv";
  if (/^S\s?\d/.test(pr)) return "s";
  if (/^(CJX|REX|R)\s?\d/.test(pr)) return "r";
  return "u";
}

// Fehlversuche in Folge: ein einzelner Aussetzer wird still wiederholt, erst ab dem zweiten gibt es eine Meldung
let failures = 0;
const RETRY_MS = 5000;

async function load() {
  clearTimeout(refreshTimer);
  const st = current;
  if (!st) return;
  const url = BASE + "stboard.exe/dn?L=vs_scotty.vs_liveticker&evaId=" + encodeURIComponent(st.id) +
    "&boardType=dep&productsFilter=" + FILTERS[filter] +
    "&dirInput=&tickerID=dep&start=yes&eqstops=true&showJourneys=40&additionalTime=0&outputMode=tickerDataOnly";
  let ok = false;
  try {
    const data = await loadScript(url, "journeysObj");
    if (current !== st) return;
    if (!data) throw new Error("Unerwartete Antwort");
    render(data);
    lastUpdate = Date.now();
    failures = 0;
    ok = true;
    showUpdated();
  } catch (err) {
    if (current !== st) return;
    failures++;
    if (failures >= 2 && !$("#rows").children.length) showMsg(err.message + " – neuer Versuch in 30 s", true);
    showUpdated();
  }
  // Im Hintergrund nicht weiter abfragen; beim Zurückkehren lädt die App sofort neu.
  // Nach dem ersten Fehlversuch schon nach 5 s erneut versuchen, sonst im normalen 30-s-Takt.
  if (current === st && !document.hidden) refreshTimer = setTimeout(load, !ok && failures === 1 ? RETRY_MS : REFRESH_MS);
}

// „aktualisiert vor x s“ – wird rot, wenn länger als 90 s keine neuen Daten kamen
let lastUpdate = 0;
function showUpdated() {
  const el = $("#updated");
  if (!current || !lastUpdate) { el.innerHTML = ""; return; }
  const s = Math.round((Date.now() - lastUpdate) / 1000);
  el.classList.toggle("stale", s > 90);
  el.innerHTML = `<i class="live"></i>` + (s > 90 ? "keine Verbindung" : s < 5 ? "gerade aktualisiert" : `vor ${s} s aktualisiert`);
}
setInterval(showUpdated, 1000);

function minutesUntil(da, ti) {
  const [d, m, y] = (da || "").split(".").map(Number);
  const [h, min] = (ti || "").split(":").map(Number);
  if (!y || isNaN(h)) return Infinity;
  return (new Date(y, m - 1, d, h, min) - Date.now()) / 60000;
}

function render(data) {
  const rows = (data.journey || []).map(j => {
    const rt = j.rt || null;
    const status = rt && rt.status ? unescapeHtml(rt.status) : "";
    const cancelled = /ausf|fällt|entf/i.test(status);
    const delay = rt && rt.dlm ? parseInt(rt.dlm, 10) : 0;
    let rtHtml = "";
    if (cancelled) rtHtml = `<span class="rt cancel">entfällt</span>`;
    else if (rt && delay > 0) rtHtml = `<span class="rt late">${esc(rt.dlt || "")}</span>`;
    const dest = unescapeHtml(j.st).replace(/<[^>]+>/g, "");
    const last = unescapeHtml(j.lastStop || "");
    const pr = unescapeHtml(j.pr || "").replace(/\s+/g, " ").trim().replace(/^BusSV\s?/, "SEV ");
    const track = unescapeHtml(j.tr || "");
    let note = "";
    if (cancelled) note = `<span class="note cancel">Zug fällt aus</span>`;
    else if (delay >= 5) note = `<span class="note late">ca. +${delay} min</span>`;
    else if (status && !/^neu$/i.test(status)) note = `<span class="note late">${esc(status)}</span>`;
    else if (/^neu$/i.test(status)) note = `<span class="note late">Zusatzfahrt</span>`;
    if (j.trChg && !cancelled) note += `<span class="note late">Gleisänderung</span>`;
    // Punkt: Farbe nach Echtzeitstatus, blinkt in den letzten 2 Minuten vor der (tatsächlichen) Abfahrt
    // (ÖBB liefert Echtzeitdaten nur bei Abweichungen – ohne Eintrag gilt der Zug als planmäßig)
    let dot = "ok";
    if (cancelled) dot = "cancel";
    else if (delay > 0) dot = "late";
    const mins = minutesUntil(j.da, (rt && rt.dlt) || j.ti);
    const blink = !cancelled && mins <= 2 && mins >= -1;
    return `<tr class="${cancelled ? "cancelled" : ""}">
      <td class="time"><span class="t"><i class="dot ${dot}${blink ? " blink" : ""}"></i>${esc(j.ti)}</span>${rtHtml}</td>
      <td class="train"><span class="badge ${badgeClass(pr)}">${esc(pr)}</span></td>
      <td class="dest"><span class="name">${esc(dest)}</span>${last && last !== dest && !last.startsWith(dest) ? `<span class="via">→ ${esc(last)}</span>` : ""}${note}</td>
      <td class="track ${j.trChg ? "changed" : ""}">${esc(track)}</td>
    </tr>`;
  });
  $("#rows").innerHTML = rows.join("");
  showMsg(rows.length ? "" : "Derzeit keine Abfahrten.");
}

// Aktualisieren, wenn die App wieder in den Vordergrund kommt
// Im Hintergrund pausieren, beim Zurückkehren sofort aktualisieren
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(refreshTimer);
  else if (current) load();
});

// ---------- Start ----------
const params = new URLSearchParams(location.search);
if (params.get("id")) {
  const id = params.get("id");
  const known = STATIONS.find(s => s.id === id) || favorites().find(s => s.id === id) || recent().find(s => s.id === id);
  const st = { id, n: params.get("n") || known?.n || "Station", bahn: params.get("hst") ? false : (known?.bahn ?? true), x: known?.x, y: known?.y };
  history.replaceState({ st }, "", location.href);
  openStation(st, false);
} else {
  renderLists();
}

// ---------- Updates ----------
// Eine neue Version wartet im Hintergrund, bis der Nutzer auf „Aktualisieren“ tippt.
let waitingWorker = null, updating = false;
function showUpdateBar(w) { waitingWorker = w; $("#update").classList.remove("hidden"); }

$("#update-btn").addEventListener("click", () => {
  updating = true;
  // „Zuletzt“ und alte Einstellungen löschen – Favoriten bleiben. Den alten Cache räumt die neue Version selbst weg.
  store.remove("recent"); store.remove("filter");
  $("#update-btn").disabled = true;
  $("#update-btn").textContent = "Wird geladen …";
  if (waitingWorker) waitingWorker.postMessage("update"); else location.reload();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
    // Hinweis nur, wenn schon eine ältere Version DIESER App aktiv ist (nicht bei der Erstinstallation;
    // die Beta wird anfangs vom Service Worker der Produktivversion mitverwaltet)
    if (reg.waiting && reg.active) showUpdateBar(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      const hadOld = !!reg.active;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && hadOld) showUpdateBar(w);
      });
    });
    // Versionsnummer beim eigenen Service Worker abfragen
    const askVersion = () => reg.active && reg.active.postMessage("version");
    askVersion();
    navigator.serviceWorker.addEventListener("controllerchange", askVersion);
    // Nach neuer Version schauen: beim Zurückkehren in die App und alle 30 Minuten
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});

  navigator.serviceWorker.addEventListener("controllerchange", () => { if (updating) location.reload(); });
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data && e.data.version) document.querySelectorAll(".version").forEach((el) => el.textContent = "Version " + e.data.version);
  });
}
</script>
