# Veröffentlicht die App auf GitHub Pages – jedes Repository seinen eigenen Branch main:
#   einschlawiner-technic/abfahrt              -> https://einschlawiner-technic.github.io/abfahrt/               (Produktiv)
#   einschlawiner-technic/beta-abfahrt         -> https://einschlawiner-technic.github.io/beta-abfahrt/          (Beta)
#   einschlawiner-technic/experimental-abfahrt -> https://einschlawiner-technic.github.io/experimental-abfahrt/  (Experimental)
# Der Code liegt in einschlawiner-technic/abfahrt (Branches main, beta, experimental);
# beta und experimental werden zusätzlich als main in die beiden anderen Repositorys geschoben.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Nicht benötigte Dateien entfernen
        run: rm -rf site/.git site/.github

      # Früher lagen Beta und Experimental unter …/abfahrt/beta/ und …/abfahrt/experimental/.
      # Dort bleibt nur eine Umleitung auf die neuen Adressen.
      - name: Umleitungen für die alten Adressen
        if: github.repository == 'einschlawiner-technic/abfahrt'
        run: |
          for ch in beta experimental; do
            mkdir -p "site/$ch"
            cat > "site/$ch/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Umgezogen</title>
          <meta http-equiv="refresh" content="0; url=/$ch-abfahrt/">
          <script>location.replace("/$ch-abfahrt/" + location.search + location.hash);</script>
          <p>Neue Adresse: <a href="/$ch-abfahrt/">/$ch-abfahrt/</a></p>
          HTML
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
