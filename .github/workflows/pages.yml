# Veröffentlicht die App auf GitHub Pages:
#   Branch main -> https://einschlawiner-technic.github.io/abfahrt/       (Produktivversion)
#   Branch beta -> https://einschlawiner-technic.github.io/abfahrt/beta/  (Testversion)
#   Branch experimental -> https://einschlawiner-technic.github.io/abfahrt/experimental/  (Spielwiese)
# Läuft bei jedem Push auf einen der Branches und baut immer alle zusammen.
name: Pages

on:
  push:
    branches: [main, beta, experimental]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Produktivversion (main) holen
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Prüfen, welche Branches es gibt
        id: branches
        run: |
          for b in beta experimental; do
            if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "$b" >/dev/null; then
              echo "$b=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Testversion (beta) holen
        if: steps.branches.outputs.beta == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: site/beta

      - name: Experimental-Version (experimental) holen
        if: steps.branches.outputs.experimental == 'true'
        uses: actions/checkout@v4
        with:
          ref: experimental
          path: site/experimental

      - name: Nicht benötigte Dateien entfernen
        run: rm -rf site/.git site/.github site/beta/.git site/beta/.github site/experimental/.git site/experimental/.github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
